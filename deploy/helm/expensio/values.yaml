# Expensio Helm values。
#
# 这个 chart 不部署有状态依赖（PostgreSQL / Redis / Kafka）；它们由平台团队
# 或云服务提供，地址通过 values 注入。Chart 也不创建 Secret：生产密钥只能
# 来自预先存在的 K8s Secret，键名见 secretKeys。这样 `helm get values` 与
# Git 历史里都不会出现明文。

nameOverride: ""
fullnameOverride: ""

images:
  # 每个服务一个仓库：{registry}/{service}:{tag}
  registry: ghcr.io/edgerunner-fris/expensio
  tag: "0.1.0"
  pullPolicy: IfNotPresent
  # 迁移镜像 = golang-migrate CLI + 仓库 migrations/
  migrate: ghcr.io/edgerunner-fris/expensio-migrate

imagePullSecrets: []

# 预先创建的 Secret 名称。缺少必需键时 Pod 会停在 CreateContainerConfigError，
# 这是有意的：宁可起不来，也不要带着空密钥提供服务。
existingSecret: expensio-secrets
secretKeys:
  # identity 用私钥签发；其余服务只挂公钥验签。公钥是公开信息，
  # 但仍放在 Secret 里是为了与现有密钥分发流程保持一致。
  jwtPrivateKey: EXPENSIO_JWT_PRIVATE_KEY
  jwtPublicKeys: EXPENSIO_JWT_PUBLIC_KEYS
  dbAppPassword: EXPENSIO_DB_APP_PASSWORD
  dbMigratorPassword: EXPENSIO_DB_MIGRATOR_PASSWORD
  # PostgreSQL 私有 CA 的 PEM；只在 database.tlsCA=true 时挂载到数据库相关 Pod。
  dbTLSCA: EXPENSIO_DB_TLS_CA
  billingWebhook: EXPENSIO_BILLING_WEBHOOK_SECRET
  # 只在 kafka.saslMechanism 非空时注入到需要 Kafka 的服务。
  kafkaSASLPassword: EXPENSIO_KAFKA_SASL_PASSWORD
  # 私有 CA 的 PEM；只在 kafka.tlsCA=true 时挂载到 Kafka 相关 Pod。
  kafkaTLSCA: EXPENSIO_KAFKA_TLS_CA
  # 托管 Redis（ElastiCache AUTH / Azure Cache）需要；本地无认证时可省略。
  redisPassword: EXPENSIO_REDIS_PASSWORD
  internalToken: EXPENSIO_NOTIFICATION_INTERNAL_TOKEN
  smtpPassword: EXPENSIO_NOTIFICATION_SMTP_PASSWORD
  # 对象存储凭据只给 expense 挂载；桶由服务启动时确保存在。
  minioAccessKey: EXPENSIO_MINIO_ACCESS_KEY
  minioSecretKey: EXPENSIO_MINIO_SECRET_KEY

env: prod
logLevel: info

database:
  host: postgres.example.internal
  port: 5432
  # 生产必须 require 或 verify-full；disable 只适用于本地 compose。
  # verify-ca / verify-full 会校验证书：公有 CA（RDS 等）用系统根证书即可，
  # 自签 CA 需要同时开启 tlsCA 把 CA 挂进容器。
  sslmode: require
  tlsCA: false

redis:
  addr: redis.example.internal:6379

kafka:
  brokers: kafka.example.internal:9092
  # 初始化 topic 的 Kafka CLI 镜像。国内/离线集群拉不到 Docker Hub 时，
  # 换成镜像仓库里的同一版本副本；CLI 必须与 broker 主版本兼容。
  cliImage: apache/kafka:3.9.2
  # 托管 Kafka 几乎都要求 TLS；本地 compose 为 false。
  tls: false
  # 私有 CA（自建集群、企业 PKI）。公有 CA 签发的托管服务保持 false。
  # 开启后从 existingSecret 的 secretKeys.kafkaTLSCA 键挂载 ca.pem。
  tlsCA: false
  # 空表示不做 SASL。可选 plain / scram-sha-256 / scram-sha-512：
  # AWS MSK 常用 SCRAM，Event Hubs / Confluent Cloud 用 PLAIN。
  # 开启后必须同时设置 tls（配置层会拒绝 SASL_PLAINTEXT）。
  saslMechanism: ""
  saslUsername: ""
  # 口令不放在 values 里，见 secretKeys.kafkaSASLPassword。

# 附件对象存储。chart 不部署 MinIO：桶由平台提供，启动时自动创建。
# publicEndpoint 是浏览器地址，只影响 presigned URL 的 Host 与签名；
# 它必须指向用户能访问的入口（通常是对象存储的 Ingress / 负载均衡域名）。
# 与 endpoint 一样**不带 scheme**：写 https:// 会让 expense 启动时直接失败，
# 是否 TLS 由 useSSL 决定。
minio:
  endpoint: minio.example.internal:9000
  publicEndpoint: files.expensio.example.com
  bucket: expensio-invoices
  useSSL: true

# OTLP 导出目标。Chart 不部署 Collector：地址由平台提供，
# 且 Collector 必须同时暴露 OTLP/gRPC 4317 与可被 Prometheus 抓取的指标端点。
otel:
  enabled: false
  endpoint: otel-collector.observability.svc.cluster.local:4317
  # 集群内通常是明文 gRPC；跨网络时改为 false 并配置 TLS。
  insecure: true

billing:
  webhookProvider: mockpay

notification:
  emailEnabled: true
  smtpAddr: smtp.example.internal:587
  smtpFrom: no-reply@expensio.example
  smtpUsername: ""
  # true 时服务器不支持 STARTTLS 就拒绝发送。
  smtpUseTLS: true

# 成员邀请链接前缀：必须等于用户浏览器里访问的站点（Ingress 对外地址）。
invite:
  baseURL: https://expensio.example.com
  ttl: 168h

rateLimit:
  authPerMinute: 20
  authBurst: 10
  apiPerMinute: 1200
  apiBurst: 200

# 网关对每个下游独立熔断：连续 failures 次 502/503/504 或网络错误后打开，
# timeout 过后放 maxRequests 个半开探测。interval=0 表示 counts 不做周期清零。
circuitBreaker:
  failures: 5
  interval: 0s
  timeout: 30s
  maxRequests: 1

http:
  # 允许携带 X-Forwarded-For 的上游网段，逗号分隔的 IP / CIDR。
  # 流量路径是 ingress → web（Go 反代）→ gateway，网关看到的直接来源
  # 永远是 web Pod。留空则所有用户共享同一个限流桶，并把 web Pod IP
  # 写进审计日志。部署时必须填集群 Pod CIDR（或 ingress controller 网段）。
  trustedProxies: ""

# 每项至少要有 port；其余字段控制注入哪些环境变量。
services:
  identity:
    port: 8081
    replicas: 1
    db: true
    jwt: true
    internalToken: true
  expense:
    port: 8082
    replicas: 1
    db: true
    jwt: true
    kafka: true
    minio: true
  billing:
    port: 8083
    replicas: 1
    db: true
    jwt: true
    kafka: true
    billingWebhook: true
  report:
    port: 8084
    replicas: 1
    db: true
    jwt: true
    kafka: true
    # report 的仪表盘缓存用 Redis（cmd/report/main.go 里 NeedsRedis=true）。
    # 少这一行时地址仍从 ConfigMap 注入，但口令不会进容器，托管 Redis 上
    # 启动即 NOAUTH，缓存被静默禁用——功能不坏，但缓存永远不命中。
    redis: true
  notification:
    port: 8085
    replicas: 1
    db: true
    jwt: true
    kafka: true
    internalToken: true
    notification: true
  gateway:
    port: 8080
    replicas: 2
    jwt: true
    redis: true
    upstreams: true

web:
  replicas: 2
  port: 8086

# 水平扩缩容。开启后 Deployment 不再写死 replicas（否则 Helm 与 HPA 会互相
# 覆盖），由 HPA 按 CPU（可选内存）利用率调整。需要集群已安装 metrics-server
# 或 Prometheus Adapter；没有指标源时 HPA 会停在 <unknown>，不会扩容。
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  # 达到 requests 的百分之多少时扩容。必须设置 resources.requests.cpu，
  # 否则 CPU 利用率没有分母。
  targetCPUUtilizationPercentage: 70
  # 留空表示不按内存扩缩；内存指标抖动大，通常不建议单独作为扩容依据。
  targetMemoryUtilizationPercentage: null
  # 可选：直接透传给 HPA v2 的 behavior（扩缩容速率限制）。
  behavior: {}
  # 按服务覆盖，键名与 services 相同；web 用 autoscaling.web。
  # 例：gateway: {minReplicas: 3, maxReplicas: 20, targetCPUUtilizationPercentage: 60}
  services: {}
  web: {}

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: expensio.example.com
  tls:
    enabled: true
    secretName: expensio-tls
  # cert-manager 自动签发证书。只写注解，Issuer/ClusterIssuer 由平台预先创建。
  # 必须同时开启 ingress.tls，否则证书没有地方存放（模板会直接报错）。
  certManager:
    enabled: false
    # 二选一；clusterIssuer 优先。
    clusterIssuer: ""
    issuer: ""

migration:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600

topics:
  enabled: true
  partitions: 6
  replicationFactor: 3
  backoffLimit: 6
  activeDeadlineSeconds: 600

networkPolicy:
  enabled: true
  # 以命名空间标签选择 ingress controller；不同发行版按需覆盖。
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    # identity 的 argon2id 每次哈希固定占用 64 MiB（m=65536），加上 Go 运行时
    # 的 GC 余量，256Mi 时两三个并发登录就会 OOMKilled（k3d 压测实测）。
    # limit 是上限而非预留，放宽到 512Mi 不增加常态占用。
    memory: 512Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
