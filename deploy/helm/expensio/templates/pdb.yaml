{{- $root := . }}
{{- range $name, $svc := .Values.services }}
{{- if gt (int ($svc.replicas | default 1)) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-%s" (include "expensio.fullname" $root) $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "expensio.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "expensio.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
{{- end }}
{{- end }}
{{- if gt (int .Values.web.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-web" (include "expensio.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "expensio.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "expensio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
{{- end }}
