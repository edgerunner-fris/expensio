{{- $root := . }}
{{- $secret := .Values.existingSecret }}
{{- $keys := .Values.secretKeys }}
{{- range $name, $svc := .Values.services }}
{{- $override := index ($root.Values.autoscaling.services | default dict) $name | default dict }}
{{- $hpa := $root.Values.autoscaling.enabled }}
{{- if and $hpa (hasKey $override "enabled") }}{{ $hpa = $override.enabled }}{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "expensio.fullname" $root) $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "expensio.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if not $hpa }}
  replicas: {{ $svc.replicas | default 1 }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "expensio.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "expensio.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        # ConfigMap 变化时滚动重启，避免 Pod 继续用旧配置。
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- with $root.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "expensio.fullname" $root }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "expensio.image" (dict "root" $root "name" $name) | quote }}
          imagePullPolicy: {{ $root.Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "expensio.fullname" $root }}-config
          env:
            - name: EXPENSIO_HTTP_ADDR
              value: ":{{ $svc.port }}"
            {{- if $svc.db }}
            - name: EXPENSIO_DB_NAME
              value: {{ printf "%s_db" $name | quote }}
            - name: EXPENSIO_DB_USER
              value: {{ printf "%s_app" $name | quote }}
            - name: EXPENSIO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $keys.dbAppPassword }}
            {{- end }}
            {{- if $svc.kafka }}
            # 只有需要 Kafka 的服务才拿 SASL 配置：identity 不消费事件，
            # 给它注入认证参数只会在缺键时让它无故起不来。
            - name: EXPENSIO_KAFKA_TLS
              value: {{ $root.Values.kafka.tls | quote }}
            - name: EXPENSIO_KAFKA_SASL_MECHANISM
              value: {{ $root.Values.kafka.saslMechanism | quote }}
            - name: EXPENSIO_KAFKA_SASL_USERNAME
              value: {{ $root.Values.kafka.saslUsername | quote }}
            {{- if $root.Values.kafka.saslMechanism }}
            - name: EXPENSIO_KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $keys.kafkaSASLPassword }}
            {{- end }}
            {{- if $root.Values.kafka.tlsCA }}
            - name: EXPENSIO_KAFKA_TLS_CA_FILE
              value: /etc/expensio/kafka/ca.pem
            {{- end }}
            {{- end }}
            {{- if $svc.redis }}
            # 可选键：本地/验收 Redis 无认证。托管 Redis 必须提供，否则请求
            # 会因 NOAUTH 失败——这是显式的运行期错误，不是静默降级。
            - name: EXPENSIO_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $keys.redisPassword }}
                  optional: true
            {{- end }}
            {{- if $svc.jwt }}
            - name: EXPENSIO_JWT_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $keys.jwtPublicKeys }}
            {{- if eq $name "identity" }}
            - name: EXPENSIO_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $keys.jwtPrivateKey }}
            {{- end }}
            {{- end }}
            {{- if $svc.minio }}
            - name: EXPENSIO_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $keys.minioAccessKey }}
            - name: EXPENSIO_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $keys.minioSecretKey }}
            {{- end }}
            {{- if $svc.billingWebhook }}
            - name: EXPENSIO_BILLING_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $keys.billingWebhook }}
            {{- end }}
            {{- if $svc.internalToken }}
            - name: EXPENSIO_NOTIFICATION_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $keys.internalToken }}
            {{- end }}
            {{- if $svc.notification }}
            - name: EXPENSIO_NOTIFICATION_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $keys.smtpPassword }}
                  # 允许本地/无认证 SMTP；生产 Secret 里应提供该键。
                  optional: true
            {{- end }}
          {{- if and $svc.kafka $root.Values.kafka.tlsCA }}
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/expensio/kafka
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml $root.Values.securityContext | nindent 12 }}
      {{- if and $svc.kafka $root.Values.kafka.tlsCA }}
      volumes:
        - name: kafka-ca
          secret:
            secretName: {{ $secret }}
            items:
              - key: {{ $keys.kafkaTLSCA }}
                path: ca.pem
      {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
