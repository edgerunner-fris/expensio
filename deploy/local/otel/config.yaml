# OTel Collector 本地配置。
#
# 数据流：
#   服务 --OTLP gRPC--> Collector --otlphttp--> Tempo（trace）
#                              --prometheus--> :8889（Prometheus 抓取）
#
# resource_to_telemetry_conversion 把 service.name / service.version 变成
# Prometheus 标签，这样一张看板就能按服务拆分，不需要给每个服务建 target。
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # memory_limiter 必须排在 processors 列表第一位，否则内存压力下无法及时拒绝新数据。
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
