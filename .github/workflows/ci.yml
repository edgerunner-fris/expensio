name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: go.mod
  NODE_VERSION: "24"

jobs:
  backend:
    name: Go 检查与集成测试
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "以下文件未格式化："
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # CI 里 Docker 一定可用；EXPENSIO_REQUIRE_DOCKER=1 让集成测试在
      # Docker 不可用时失败，而不是 t.Skip 后假装通过。
      - name: 集成测试（真实 PostgreSQL / Redis / Kafka）
        env:
          EXPENSIO_REQUIRE_DOCKER: "1"
        run: go test ./... -race -count=1 -timeout=25m

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build

  helm:
    name: Helm lint 与渲染
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: helm lint
        run: helm lint deploy/helm/expensio

      - name: helm template
        run: helm template expensio deploy/helm/expensio > /tmp/expensio-manifests.yaml

      # helm lint / template 只证明模板能渲染，不证明字段符合 API schema。
      # kubeconform 用官方 OpenAPI schema 逐字段校验，挡掉拼错的字段名
      # （K8s 会静默忽略未知字段）。
      - name: kubeconform 校验渲染结果
        run: |
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.31.0 \
            < /tmp/expensio-manifests.yaml

  images:
    name: 镜像 ${{ matrix.service }}
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [identity, expense, billing, report, notification, gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  web-image:
    name: 镜像 web
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          build-args: |
            VERSION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  migrate-image:
    name: 镜像 migrate
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-migrate:${{ github.sha }}
            ghcr.io/${{ github.repository }}-migrate:latest

  # 浏览器级 E2E 需要完整整栈（六个服务、管理台、Postgres/Redis/Kafka/MinIO、
  # Mailpit 与 Playwright），所以只在 main 上、复用刚推送的镜像跑一次：
  # 测的就是要部署的那批镜像，而不是 runner 上重新构建的另一份。
  # PR 不跑（需要先起整栈，成本高）；本地用 `make e2e`。
  e2e:
    name: 浏览器端到端（整栈）
    needs: [backend, frontend, images, web-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    env:
      EXPENSIO_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取本次提交的镜像并打上本地标签
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          for svc in identity expense billing report notification gateway web; do
            docker pull "ghcr.io/${repo}/${svc}:${GITHUB_SHA}"
            docker tag "ghcr.io/${repo}/${svc}:${GITHUB_SHA}" "expensio/${svc}:${GITHUB_SHA}"
          done

      - name: 生成本地密钥（.env，权限 600）
        run: bash scripts/env.sh

      - name: 启动整栈（使用已推送镜像，不重新构建）
        run: docker compose --profile app up -d --wait --wait-timeout 420

      - name: Playwright
        run: docker compose --profile app --profile e2e run --rm e2e

      - name: 失败时导出服务日志
        if: failure()
        run: docker compose --profile app logs --no-color --tail=200

      - name: 清理
        if: always()
        run: docker compose --profile core --profile obs --profile mail --profile app down -v
