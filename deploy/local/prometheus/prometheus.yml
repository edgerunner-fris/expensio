# Prometheus 本地抓取与告警配置。
#
# 服务不直接暴露 /metrics：它们通过 OTLP 推给 Collector，由 Collector 的
# prometheus exporter 在 :8889 上转成拉取端点。好处是服务侧只需要一个
# 推送通道，坏处是 Collector 成为单点——所以 alert 里先盯 build_info 数量。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
