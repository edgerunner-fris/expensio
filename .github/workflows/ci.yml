name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: go.mod
  NODE_VERSION: "24"

jobs:
  backend:
    name: Go 检查与集成测试
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "以下文件未格式化："
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # CI 里 Docker 一定可用；EXPENSIO_REQUIRE_DOCKER=1 让集成测试在
      # Docker 不可用时失败，而不是 t.Skip 后假装通过。
      - name: 集成测试（真实 PostgreSQL / Redis / Kafka）
        env:
          EXPENSIO_REQUIRE_DOCKER: "1"
        run: go test ./... -race -count=1 -timeout=25m

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build

  helm:
    name: Helm lint 与渲染
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: helm lint
        run: helm lint deploy/helm/expensio

      - name: helm template
        run: helm template expensio deploy/helm/expensio > /tmp/expensio-manifests.yaml

      # helm lint / template 只证明模板能渲染，不证明字段符合 API schema。
      # kubeconform 用官方 OpenAPI schema 逐字段校验，挡掉拼错的字段名
      # （K8s 会静默忽略未知字段）。
      - name: kubeconform 校验渲染结果
        run: |
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.31.0 \
            < /tmp/expensio-manifests.yaml

  security:
    name: 依赖漏洞扫描
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # 只看代码实际会执行到的漏洞路径；govulncheck 发现可达漏洞时退出码非 0。
      # 未调用到的模块漏洞仍会打印，但不会让流水线失败。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  openapi:
    name: OpenAPI 契约校验
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 契约与路由的一致性由 backend 里的 internal/contract 测试保证；
      # 这里只校验文档本身（结构、命名、引用、示例）。
      - name: redocly lint
        run: npx --yes @redocly/cli@1.34.3 lint api/openapi.yaml

  images:
    name: 镜像 ${{ matrix.service }}
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [identity, expense, billing, report, notification, gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  web-image:
    name: 镜像 web
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          build-args: |
            VERSION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  migrate-image:
    name: 镜像 migrate
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-migrate:${{ github.sha }}
            ghcr.io/${{ github.repository }}-migrate:latest

  # 浏览器级 E2E 需要完整整栈（六个服务、管理台、Postgres/Redis/Kafka/MinIO、
  # Mailpit 与 Playwright），所以只在 main 上、复用刚推送的镜像跑一次：
  # 测的就是要部署的那批镜像，而不是 runner 上重新构建的另一份。
  # PR 不跑（需要先起整栈，成本高）；本地用 `make e2e`。
  e2e:
    name: 浏览器端到端（整栈）
    needs: [backend, frontend, images, web-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    env:
      EXPENSIO_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取本次提交的镜像并打上本地标签
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          for svc in identity expense billing report notification gateway web; do
            docker pull "ghcr.io/${repo}/${svc}:${GITHUB_SHA}"
            docker tag "ghcr.io/${repo}/${svc}:${GITHUB_SHA}" "expensio/${svc}:${GITHUB_SHA}"
          done

      - name: 生成本地密钥（.env，权限 600）
        run: bash scripts/env.sh

      - name: 启动整栈（使用已推送镜像，不重新构建）
        run: docker compose --profile app up -d --wait --wait-timeout 420

      - name: Playwright
        run: docker compose --profile app --profile e2e run --rm e2e

      - name: 失败时导出服务日志
        if: failure()
        run: docker compose --profile app logs --no-color --tail=200

      - name: 清理
        if: always()
        run: docker compose --profile core --profile obs --profile mail --profile app down -v

  # 真实集群验收：k3d 起一个双节点 k3s，安装单节点依赖后执行
  # `helm upgrade --install --wait`，再断言 Hook、Ingress、NetworkPolicy（k3s
  # 由 kube-router 真正执行策略）与 RBAC 的实际行为。kubeconform 只能证明
  # schema 合法，证明不了这些。
  cluster:
    name: 真实集群 Helm 安装（k3d）
    needs: [backend, frontend, images, web-image, migrate-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: 创建 k3d 集群
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/k3d https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          k3d cluster create expensio --servers 1 --agents 1 \
            --port 8080:80@loadbalancer --wait
          kubectl get nodes -o wide

      - name: 生成密钥并创建 Secret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm ED25519 -out /tmp/jwt.pem
          # 必须存成 shell 变量：写进 $GITHUB_ENV 的值只在后续 step 生效，
          # 本 step 里用 set -u 引用会直接 unbound variable 退出。
          JWT_PRIVATE_KEY=$(openssl pkey -in /tmp/jwt.pem -outform DER | tail -c 32 | base64 -w0)
          JWT_PUBLIC_KEY=$(openssl pkey -in /tmp/jwt.pem -pubout -outform DER | tail -c 32 | base64 -w0)
          rm -f /tmp/jwt.pem
          DB_APP_PASSWORD=$(openssl rand -hex 16)
          DB_MIGRATOR_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          BILLING_WEBHOOK_SECRET=$(openssl rand -hex 32)
          INTERNAL_TOKEN=$(openssl rand -hex 32)
          MINIO_ROOT_USER=$(openssl rand -hex 8)
          MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)

          kubectl create namespace expensio
          kubectl -n expensio create configmap postgres-init \
            --from-file=01-bootstrap.sh=deploy/local/postgres/init/01-bootstrap.sh
          kubectl -n expensio create secret generic expensio-secrets \
            --from-literal=EXPENSIO_JWT_PRIVATE_KEY="$JWT_PRIVATE_KEY" \
            --from-literal=EXPENSIO_JWT_PUBLIC_KEYS="$JWT_PUBLIC_KEY" \
            --from-literal=EXPENSIO_DB_APP_PASSWORD="$DB_APP_PASSWORD" \
            --from-literal=EXPENSIO_DB_MIGRATOR_PASSWORD="$DB_MIGRATOR_PASSWORD" \
            --from-literal=EXPENSIO_BILLING_WEBHOOK_SECRET="$BILLING_WEBHOOK_SECRET" \
            --from-literal=EXPENSIO_NOTIFICATION_INTERNAL_TOKEN="$INTERNAL_TOKEN" \
            --from-literal=EXPENSIO_MINIO_ACCESS_KEY="$MINIO_ROOT_USER" \
            --from-literal=EXPENSIO_MINIO_SECRET_KEY="$MINIO_ROOT_PASSWORD"
          kubectl -n expensio create secret generic deps-secrets \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            --from-literal=MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD"
          kubectl -n expensio create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GH_TOKEN"

      - name: 部署验收用依赖
        run: |
          set -euo pipefail
          kubectl apply -f deploy/cluster/acceptance/deps.yaml
          kubectl -n expensio rollout status deploy/postgres --timeout=300s
          kubectl -n expensio rollout status deploy/redis --timeout=180s
          kubectl -n expensio rollout status deploy/kafka --timeout=300s
          kubectl -n expensio rollout status deploy/minio --timeout=180s

      - name: helm upgrade --install
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          helm upgrade --install expensio deploy/helm/expensio \
            -n expensio --wait --timeout 15m \
            -f deploy/cluster/acceptance/values.yaml \
            --set images.registry="ghcr.io/${repo}" \
            --set images.tag="${GITHUB_SHA}" \
            --set images.migrate="ghcr.io/${repo}-migrate"

      - name: 集群内验收（Hook / Ingress / NetworkPolicy / RBAC / 事件链路）
        run: bash deploy/cluster/acceptance/smoke.sh

      - name: 失败时导出集群状态
        if: failure()
        run: |
          kubectl -n expensio get all,jobs,ingress,pdb -o wide || true
          kubectl -n expensio describe pods || true
          kubectl -n expensio get events --sort-by=.lastTimestamp | tail -60 || true
          for d in $(kubectl -n expensio get deploy -o name); do
            kubectl -n expensio logs "$d" --all-containers --tail=200 || true
          done
          helm -n expensio status expensio || true

      - name: 清理
        if: always()
        run: k3d cluster delete expensio
